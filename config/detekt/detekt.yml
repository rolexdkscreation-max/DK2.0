# पुरानी गलतियाँ baseline.xml में; नई = CI लाल. चलाना: .github/workflows/code-check.yml
build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

comments:
  active: false
complexity:
  active: false
naming:
  active: false
performance:
  active: false
style:
  active: false

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '(ignore|expected).*'

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false
  SwallowedException:
    active: false
  PrintStackTrace:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  RethrowCaughtException:
    active: true

coroutines:
  active: true
  InjectDispatcher:
    active: false
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true

potential-bugs:
  active: true
