  महिला / पुरुष AI कैरेक्टर. Three.js ऐप में पहले से है (../forge/three.module.min.js) - APK में कुछ भारी नहीं जुड़ा.
  Android से:  window.switchCharacter('female' | 'male')   window.setAudioLevel(0.0 .. 1.0)   window.setPaused(true | false)

<style>

  #stage,#fallback{position:fixed;inset:0;
    -webkit-mask-image:radial-gradient(circle closest-side at 50% 50%,#000 0%,#000 56%,rgba(0,0,0,.86) 68%,rgba(0,0,0,.5) 81%,rgba(0,0,0,.16) 92%,rgba(0,0,0,0) 100%);
    mask-image:radial-gradient(circle closest-side at 50% 50%,#000 0%,#000 56%,rgba(0,0,0,.86) 68%,rgba(0,0,0,.5) 81%,rgba(0,0,0,.16) 92%,rgba(0,0,0,0) 100%)}
  #stage{background:#000}
  #stage canvas{display:block;width:100%;height:100%}
  /* WebGL न चले तो भी खाली काला नहीं: हल्की साँस लेती रोशनी वाला अंडाकार */

    box-shadow:0 0 38px 10px rgba(140,232,245,.25);animation:breathe 6s ease-in-out infinite}
  #fallback .body{position:absolute;left:50%;top:84%;width:72%;height:44%;transform:translate(-50%,-50%);border-radius:50% 50% 40% 40%;
    background:radial-gradient(ellipse at 50% 18%,rgba(140,232,245,.32) 0%,rgba(140,232,245,.10) 55%,rgba(140,232,245,0) 80%)}

<script>
  // module लोड होने से पहले आई कॉल भी न खोएँ: पहले यहीं जमा, scene बनते ही वही लागू
  (function () {
    var q = /[?&]c=(male|female)/.exec(location.search);
    window.__holo = { character: q ? q[1] : 'female', level: 0, paused: false, ready: false };
    window.switchCharacter = function (type) { window.__holo.character = type === 'male' ? 'male' : 'female'; };
    window.setAudioLevel = function (v) { v = Number(v); window.__holo.level = isFinite(v) ? Math.min(1, Math.max(0, v)) : 0; };
    window.setPaused = function (p) { window.__holo.paused = !!p; };
    setTimeout(function () { if (!window.__holo.ready) document.body.classList.add('nogl'); }, 4000);
  })();
</script>

<script type="module">
import * as THREE from 'three';

const H = window.__holo;
const stage = document.getElementById('stage');

// ------------------------------------------------------------------ रंग (मालिक के बताए): हल्का फ़िरोज़ी + बर्फ़ जैसा सफ़ेद
const C_CYAN = new THREE.Color('#8CE8F5');
const C_ICE = new THREE.Color('#E0FAFF');

// ------------------------------------------------------------------ साझा uniforms (हर परत एक ही वस्तु पढ़ती है)
const U = {
  uTime: { value: 0 },      // सेकंड
  uMorph: { value: H.character === 'male' ? 1 : 0 },   // 0 = महिला, 1 = पुरुष (धुएँ में धीरे-धीरे बदलता)
  uTrans: { value: 0 },     // बदलते समय धुआँ ज़्यादा बिखरे
  uLevel: { value: 0 },     // आवाज़ (धीमे-धीमे पीछा करती)
  uGlow: { value: 0.3 },    // चेहरे की चमक
  uRipple: { value: 0 },    // लहरों का phase
  uBreath: { value: 0 },    // साँस: ऊपर-नीचे
  uCyan: { value: new THREE.Vector3(C_CYAN.r, C_CYAN.g, C_CYAN.b) },
  uIce: { value: new THREE.Vector3(C_ICE.r, C_ICE.g, C_ICE.b) },
  uPR: { value: 1 },
};

// ------------------------------------------------------------------ GLSL: 3D Simplex noise (Ashima Arts / Stefan Gustavson, MIT) + FBM + आकार
const COMMON = /* glsl */`
uniform float uTime, uMorph, uTrans, uLevel, uGlow, uRipple, uBreath;
uniform vec3 uCyan, uIce;
varying vec2 vP;

vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v) {
  const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0) * 2.0 + 1.0;
  vec4 s1 = floor(b1) * 2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
}
// कम आवृत्ति वाला FBM - सिर्फ़ धीमी, मुलायम हलचल (कोई झिलमिलाहट नहीं)
float fbm(vec3 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { s += a * snoise(p); p = p * 2.03 + vec3(1.7, 9.2, 4.1); a *= 0.5; }
  return s;
}
float fbm3(vec3 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++) { s += a * snoise(p); p = p * 2.03 + vec3(1.7, 9.2, 4.1); a *= 0.5; }
  return s;
}
float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
float sdEllipse(vec2 p, vec2 r) { return (length(p / r) - 1.0) * min(r.x, r.y); }
float sdRoundBox(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }

vec2 headC() { return vec2(0.0, 0.34); }
vec2 headR() { return mix(vec2(0.158, 0.212), vec2(0.176, 0.218), uMorph); }

// चिकना अंडाकार चेहरा - महिला: पतली, मुलायम ठोड़ी; पुरुष: चौड़ा, तीखा जबड़ा (आँख / नाक / मुँह कुछ नहीं)
float sdHead(vec2 p) {
  vec2 c = headC(), r = headR();
  vec2 q = p - c;
  float k = clamp(-q.y / r.y, 0.0, 1.0);
  float wf = 1.0 - 0.20 * k * k;
  float dF = sdEllipse(q, vec2(r.x * wf, r.y));
  float wm = 1.0 + 0.15 * sin(3.14159 * pow(k, 0.8));
  float dM = sdEllipse(q, vec2(r.x * wm, r.y * 0.985));
  dM = smin(dM, sdRoundBox(q - vec2(0.0, -r.y * 0.83), vec2(r.x * 0.40, r.y * 0.13), 0.035), 0.035);
  return mix(dF, dM, uMorph);
}

// गर्दन + कंधे: महिला पतली और ढलवाँ, पुरुष चौड़े और सीधे कंधे
float sdBody(vec2 p) {
  vec2 c = headC(), r = headR();
  float top = c.y - r.y * 0.72, bot = -0.05;
  float hw = mix(0.050, 0.076, uMorph) + 0.028 * smoothstep(top - 0.12, bot, p.y);
  float dNeck = max(abs(p.x) - hw, max(p.y - top, bot - p.y));
  float a = mix(0.50, 0.75, uMorph), b = 0.50;
  float n = mix(2.2, 2.8, uMorph);
  // कंधे गर्दन से बाहर की ओर ढलते (trapezius) - महिला ज़्यादा ढलवाँ
  vec2 sp = p - vec2(0.0, -0.56);
  sp.y += abs(p.x) * mix(0.26, 0.16, uMorph);
  vec2 s = abs(sp) / vec2(a, b);
  float dSh = (pow(pow(s.x, n) + pow(s.y, n), 1.0 / n) - 1.0) * b * 0.9;
  return smin(dNeck, dSh, mix(0.10, 0.07, uMorph));
}
`;

const VERT = /* glsl */`
varying vec2 vP;
void main() { vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
`;

// ------------------------------------------------------------------ परत 1: कंधों का रेशमी धुआँ + बाल + चारों ओर की धुंध + आवाज़ की लहरें
const BODY_FRAG = /* glsl */`
${COMMON}
// महिला: लंबे, लहराते, धुएँ जैसे बाल - ऊपर सिर को ढकते, दोनों ओर कंधों के नीचे तक, सिरे धुएँ में घुलते
float hairF(vec2 p, float t) {
  vec2 c = headC(), r = headR();
  float ax = abs(p.x);
  float dH = sdHead(p);
  // ऊपर का हिस्सा: सिर से थोड़ा बड़ा, मुलायम (माथे पर बीच से माँग, कनपटी की ओर नीचे)
  vec2 cq = p - (c + vec2(0.0, 0.03));
  float dCap = sdEllipse(cq, r * vec2(1.20, 1.10));
  float hairline = c.y + r.y * (0.58 - 0.62 * pow(clamp(ax / r.x, 0.0, 1.0), 1.6)) - 0.02 * smoothstep(0.0, 0.05, ax);
  float cap = smoothstep(0.03, -0.04, dCap) * smoothstep(hairline - 0.05, hairline + 0.07, p.y);
  // दोनों ओर गिरती लटें: ऊपर चौड़ी, नीचे पतली होकर धुएँ में
  float yy = c.y + 0.10 - p.y;
  float drift = smoothstep(0.05, 0.55, yy);
  float wave = (sin(p.y * 5.2 + t * 3.0) * 0.026 + snoise(vec3(p.y * 1.8, t * 1.1, 1.3)) * 0.045) * drift;
  float cx = r.x * 1.02 + yy * 0.20 + wave;
  float hw = (0.085 + 0.022 * sin(p.y * 2.7 + t * 1.6)) * (1.0 - 0.75 * smoothstep(0.55, 1.15, yy));
  float u = (ax - cx) / hw;
  float tips = smoothstep(0.55, 1.15, yy);
  float wisp = smoothstep(-0.2, 0.5, fbm3(vec3(p * vec2(3.0, 1.2), t * 1.3)) + 0.4 - tips * 0.7);
  float fallMask = smoothstep(1.15, 0.6, abs(u)) * smoothstep(-0.10, 0.08, yy) * (1.0 - smoothstep(0.95, 1.30, yy)) * mix(1.0, wisp, tips);
  float vol = max(cap, fallMask);
  // चेहरा साफ़ रहे (सिर्फ़ ऊपर माथे पर बाल)
  vol *= max(smoothstep(-0.015, 0.035, dH), smoothstep(hairline - 0.04, hairline + 0.06, p.y));
  // रेशम जैसी लटें: बहाव की दिशा में, धीमे noise से टेढ़ी-मेढ़ी (कोई सीधी लकीर नहीं)
  float flowN = fbm3(vec3(p * vec2(2.2, 0.9), t * 0.9));
  float sideS = 0.5 + 0.5 * sin(u * 6.5 + flowN * 5.0);
  float fineS = 0.5 + 0.5 * sin(u * 15.0 + p.y * 3.0 + flowN * 8.0);
  float capA = atan(cq.x, cq.y + r.y * 0.9);
  float capS = 0.5 + 0.5 * sin(capA * 18.0 + fbm3(vec3(cq * 3.5, t)) * 5.0);
  float strands = mix(0.55 + 0.30 * capS, 0.45 + 0.35 * sideS + 0.20 * fineS, step(0.5, fallMask) * step(cap, 0.5));
  float sheen = exp(-pow(u + 0.35 + 0.15 * sin(p.y * 4.0 + t * 2.0), 2.0) * 6.0) * fallMask * 0.18;
  return vol * strands * mix(0.42, 0.55, cap) + sheen;
}
// पुरुष: छोटे, सलीके से पीछे सँवरे धुएँ जैसे बाल
float hairM(vec2 p, float t) {
  vec2 c = headC(), r = headR();
  vec2 q = p - (c + vec2(0.0, 0.025));
  float d = sdEllipse(q, r * vec2(1.07, 1.05));
  float ax = abs(p.x);
  float hairline = c.y + r.y * (0.44 - 0.34 * pow(clamp(ax / r.x, 0.0, 1.0), 1.8));
  float m = smoothstep(0.018, -0.02, d) * smoothstep(hairline - 0.03, hairline + 0.05, p.y);
  float n = fbm3(vec3(q * 5.0, t * 0.6));
  float s = 0.5 + 0.5 * sin(q.x / r.x * 9.0 * (1.0 - 0.25 * q.y / r.y) + n * 3.0);
  float strands = 0.65 + 0.35 * s;
  float rimH = exp(-abs(d) * 45.0) * smoothstep(hairline, hairline + 0.08, p.y);
  return m * strands * 0.48 + rimH * 0.26;
}
void main() {
  float t = uTime * 0.15;
  vec2 p = vP; p.y += 0.10 - uBreath;
  vec2 fc = headC();
  vec2 dv = p - fc; float dr = length(dv);
  float ring = sin(dr * 11.0 - uRipple) * exp(-dr * 1.35);
  vec3 q = vec3(p * 1.35, t);
  vec2 w = vec2(fbm3(q), fbm3(q + vec3(4.7, 1.9, 3.3)));
  vec2 pw = p + w * (0.045 + uTrans * 0.10) + (dv / (dr + 1e-3)) * ring * 0.018 * uLevel;

  float dB = sdBody(pw);
  float edgeN = fbm3(vec3(pw * 3.2, t * 1.3));
  float inside = smoothstep(0.05, -0.10, dB + edgeN * 0.06);
  float rim = exp(-abs(dB + edgeN * 0.03) * 26.0);
  float folds = pow(0.5 + 0.5 * sin(pw.x * 10.0 + pw.y * 2.0 + fbm3(vec3(pw * 1.8, t * 0.8)) * 5.0), 2.5);
  float fall = smoothstep(-1.10, -0.25, p.y);
  float headMask = smoothstep(0.02, -0.02, sdHead(p));
  float shoulder = (inside * (0.10 + 0.26 * folds) + rim * 0.50) * fall * (1.0 - headMask);

  float smoke = smoothstep(0.05, 0.75, fbm(vec3(pw * 2.1 + vec2(0.0, -t * 0.9), t * 0.6)));
  float near = exp(-max(dB, 0.0) * 3.2) * smoothstep(-1.15, -0.2, p.y) + exp(-max(sdHead(p), 0.0) * 5.0) * 0.6;
  float mist = smoke * near * 0.26 * (1.0 + uTrans * 0.8);

  float hair = mix(hairF(pw, t), hairM(pw, t), uMorph);
  float rip = max(ring, 0.0) * uLevel * 0.35 * exp(-max(dB, 0.0) * 1.5) * (0.4 + smoke);

  vec3 deep = uCyan * vec3(0.16, 0.55, 0.72);
  vec3 col = deep * mist
           + mix(uCyan, uIce, folds * 0.5) * shoulder
           + mix(uCyan, uIce, 0.55) * hair
           + uCyan * rip;
  col *= 0.85 + 0.35 * uGlow;
  gl_FragColor = vec4(col, 1.0);
}
`;

// ------------------------------------------------------------------ परत 2: बिना चेहरे वाला चमकता अंडाकार + अंदर की रोशनी (core) + आभा
const FACE_FRAG = /* glsl */`
${COMMON}
void main() {
  float t = uTime * 0.15;
  vec2 p = vP; p.y += 0.10 - uBreath;
  vec2 c = headC(), r = headR();
  float dH = sdHead(p + vec2(fbm3(vec3(p * 2.0, t)) * 0.006));
  float fill = smoothstep(0.012, -0.02, dH);
  vec2 q = (p - c) / r;
  float z = sqrt(max(0.0, 1.0 - dot(q, q)));
  vec3 n = normalize(vec3(q * 0.9, z + 0.25));
  float diff = max(dot(n, normalize(vec3(-0.35, 0.45, 0.82))), 0.0);
  float fres = pow(1.0 - z, 2.2);
  float inner = fbm(vec3(q * 1.3, t * 0.9)) * 0.5 + 0.5;
  vec2 cc = c + vec2(0.0, -0.01);
  float gr = 0.09 + 0.09 * uGlow;
  float core = exp(-dot(p - cc, p - cc) / (gr * gr));
  float rim = exp(-abs(dH) * 48.0) * (1.0 + uMorph * 0.6 * smoothstep(0.2, 0.8, -q.y));
  float halo = exp(-max(dH, 0.0) * 7.5) * (1.0 - fill);
  float crown = smoothstep(c.y + r.y * 0.40, c.y + r.y * 0.98, p.y);   // ऊपर बाल - वहाँ चेहरे की लकीर हल्की
  rim *= 1.0 - 0.6 * crown; fill *= 1.0 - 0.45 * crown;
  vec3 col = fill * (uCyan * (0.10 + 0.22 * diff + 0.12 * inner) + uIce * fres * 0.35)
           + uIce * rim * 0.50
           + mix(uCyan, uIce, 0.7) * core * (0.30 + 0.55 * uGlow)
           + uCyan * halo * (0.10 + 0.25 * uGlow);
  gl_FragColor = vec4(col * (0.75 + 0.5 * uGlow), 1.0);
}
`;

// ------------------------------------------------------------------ परत 0: बहुत धीरे तैरती हल्की तारों की धूल
const STAR_VERT = /* glsl */`
attribute float aSeed;
uniform float uTime, uPR;
varying float vA;
void main() {
  vec3 p = position;
  p.x += sin(uTime * 0.013 + aSeed * 6.283) * 0.12;
  p.y = mod(position.y + 2.0 + uTime * 0.006 * (0.5 + aSeed), 4.0) - 2.0;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
  gl_PointSize = (1.2 + aSeed * 1.8) * uPR;
  vA = (0.16 + 0.32 * fract(aSeed * 7.13)) * (0.78 + 0.22 * sin(uTime * 0.35 + aSeed * 40.0)) * (1.0 - smoothstep(1.6, 2.0, abs(p.y)));
}
`;
const STAR_FRAG = /* glsl */`
uniform vec3 uIce;
varying float vA;
void main() {
  float d = length(gl_PointCoord - 0.5);
  gl_FragColor = vec4(uIce * smoothstep(0.5, 0.0, d) * vA, 1.0);
}
`;

// ------------------------------------------------------------------ scene
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'low-power', preserveDrawingBuffer: false });
} catch (e) {
  document.body.classList.add('nogl');
  throw e;
}
let pr = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(pr);
renderer.setClearColor(0x000000, 1);
stage.appendChild(renderer.domElement);
U.uPR.value = pr;

const FOV = 26;   // कैरेक्टर डिब्बे में बड़ा, कंधे किनारे की धुंध में घुलते
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 20);
camera.position.set(0, 0, 4);

function layer(frag, z) {
  const m = new THREE.ShaderMaterial({
    uniforms: U, vertexShader: VERT, fragmentShader: frag,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2), m);
  mesh.position.z = z;
  mesh.frustumCulled = false;
  scene.add(mesh);
  return mesh;
}

// तारों की धूल (पीछे, सबसे दूर)
{
  const N = 220;
  const pos = new Float32Array(N * 3), seed = new Float32Array(N);
  let s = 1234567;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < N; i++) {
    pos[i * 3] = (rnd() * 2 - 1) * 2.1;
    pos[i * 3 + 1] = (rnd() * 2 - 1) * 2.0;
    pos[i * 3 + 2] = -0.8 - rnd() * 1.7;
    seed[i] = rnd();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: U, vertexShader: STAR_VERT, fragmentShader: STAR_FRAG,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
  });
  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  pts.renderOrder = 0;
  scene.add(pts);
}
layer(BODY_FRAG, 0.0).renderOrder = 1;
layer(FACE_FRAG, 0.02).renderOrder = 2;

function resize() {
  const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // पतले / चौड़े डिब्बे में भी पूरा कैरेक्टर दिखे (छोटी भुजा के हिसाब से)
  camera.fov = w >= h ? FOV : 2 * Math.atan(Math.tan(FOV * Math.PI / 360) * h / w) * 180 / Math.PI;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ------------------------------------------------------------------ 1D gradient noise (साँस और कैमरे की बहुत धीमी हलचल - कोई झटका नहीं)
function hash1(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return (s - Math.floor(s)) * 2 - 1; }
function noise1(x) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return 2 * ((hash1(i) * f) * (1 - u) + (hash1(i + 1) * (f - 1)) * u);
}

// ------------------------------------------------------------------ ease: हर रोशनी / चमक का बदलाव lerp 0.05 (60fps पर) - फ़्रेम-रेट से स्वतंत्र
const LERP = 0.05;
const ease = (cur, tgt, dt, k) => cur + (tgt - cur) * (1 - Math.pow(1 - k, dt * 60));

let level = 0, glow = 0.3, ripple = 0, morph = U.uMorph.value;
let last = performance.now(), T = 0;
let fAcc = 0, fN = 0;

function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 1 / 60;
  const ms = dt * 1000;
  dt = Math.min(dt, 0.05);
  T += dt;

  const target = H.level;
  level = ease(level, target, dt, LERP);
  const idle = 0.30 + 0.04 * Math.sin(T * 0.6);
  glow = ease(glow, idle + 0.70 * level, dt, LERP);
  ripple += dt * (0.55 + 1.2 * level);
  morph = ease(morph, H.character === 'male' ? 1 : 0, dt, 0.035);
  if (Math.abs(morph - Math.round(morph)) < 0.0005) morph = Math.round(morph);

  U.uTime.value = T;
  U.uLevel.value = level;
  U.uGlow.value = glow;
  U.uRipple.value = ripple;
  U.uMorph.value = morph;
  U.uTrans.value = 4 * morph * (1 - morph);
  U.uBreath.value = 0.010 * Math.sin(T * 0.8) + 0.008 * noise1(T * 0.15) + 0.004 * level;

  camera.position.x = 0.05 * noise1(T * 0.15 + 11.3);
  camera.position.y = 0.03 * noise1(T * 0.15 + 47.9);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);

  // कमज़ोर फ़ोन पर अपने-आप हल्का: औसत फ़्रेम धीमा = कम पिक्सल (एक बार में थोड़ा)
  fAcc += ms; fN++;
  if (fN >= 90) {
    const avg = fAcc / fN; fAcc = 0; fN = 0;
    if (avg > 26 && pr > 1.0) { pr = Math.max(1.0, pr - 0.25); renderer.setPixelRatio(pr); U.uPR.value = pr; resize(); }
  }
}

let running = false;
function run(on) {
  on = on && !document.hidden;
  if (on === running) return;
  running = on;
  if (on) { last = performance.now(); renderer.setAnimationLoop(frame); } else renderer.setAnimationLoop(null);
}

// ------------------------------------------------------------------ Android के लिए
window.switchCharacter = function (type) { H.character = type === 'male' ? 'male' : 'female'; };
window.setAudioLevel = function (v) { v = Number(v); H.level = isFinite(v) ? Math.min(1, Math.max(0, v)) : 0; };
window.setPaused = function (p) { H.paused = !!p; run(!H.paused); };
document.addEventListener('visibilitychange', () => run(!H.paused));
renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); run(false); });
renderer.domElement.addEventListener('webglcontextrestored', () => run(!H.paused));

H.ready = true;
run(!H.paused);
</script>
