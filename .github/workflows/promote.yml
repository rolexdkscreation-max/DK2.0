name: Promote beta to stable

# 16 नवंबर 2026 (मालिक: "बीटा और स्टेबल अपडेट"): main का हर merge बीटा release बनता है (build.yml).
# जाँच लेने के बाद यहाँ से चलाइए: बीटा release स्टेबल ("Latest") बन जाती है - स्टेबल वाले सबके फ़ोन पर अपडेट आएगा.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "कौन-सी बीटा release (जैसे v512). खाली = सबसे नई बीटा"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Beta -> Stable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_IN: ${{ github.event.inputs.tag }}
        run: |
          set -e
          TAG="$TAG_IN"
          if [ -z "$TAG" ]; then
            TAG="$(gh release list --limit 30 --exclude-drafts --json tagName,isPrerelease -q '[.[] | select(.isPrerelease)][0].tagName')"
          fi
          if [ -z "$TAG" ]; then echo "::error::कोई बीटा release नहीं मिली"; exit 1; fi
          if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx 'DK.apk'; then
            echo "::error::$TAG में DK.apk नहीं"; exit 1
          fi
          gh release view "$TAG" --json body -q .body | sed 's/^CHANNEL: *beta/CHANNEL: stable/' > notes.txt
          gh release edit "$TAG" --notes-file notes.txt --prerelease=false --latest
          echo "$TAG अब स्टेबल है"
