name: Build DK APK & UAAG Android Emulator Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # Release banane ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    # नवंबर 2026: main पर release एक-एक करके. पहले दो PR 10 सेकंड के अंतर से merge हुए (#186, #187) - दोनों build ने
    # एक ही पिछली release पढ़कर एक ही version (DK 3.143) बना दिया, और पुराने code वाली release "Latest" बन गई.
    # अब दूसरा build पहले के पूरा होने तक रुकता है, फिर नई release पढ़कर अगला version लेता है.
    # (इंतज़ार में तीसरा आए तो बीच वाला छोड़ दिया जाता है - नया build उसके सारे बदलाव भी ले लेता है)
    # PR / हाथ से चलाए build पहले जैसे साथ-साथ (हर एक का अपना group)
    concurrency:
      group: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'dk-release-main' || format('dk-build-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # pichhle release se kya badla, yeh dekhne ke liye poori history

      - name: Java 17 setup
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      - name: Signing key (hamesha ek hi)
        env:
          KS_B64: ${{ secrets.DK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dk.jks"
            echo "DK_KEYSTORE=$RUNNER_TEMP/dk.jks" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # सुरक्षा: main की release कभी debug key से नहीं - वरना फ़ोन पर पुराने ऐप के ऊपर update नहीं होगा
            echo "::error::DK_KEYSTORE_B64 secret nahi mila - main ki release debug key se nahi banegi (secret wapas daalein)"
            exit 1
          else
            echo "::warning::DK_KEYSTORE_B64 secret nahi mila - debug key se sign hoga (sirf PR / branch build)"
          fi

      - name: Update ka prakar aur version (सॉफ़्टवेयर अपडेट / सिक्योरिटी पैच)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git fetch --tags --force >/dev/null 2>&1 || true
          PREV_TAG="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          PREV_BODY="$(gh release view --json body -q .body 2>/dev/null || true)"
          PREV_VER="$(printf '%s\n' "$PREV_BODY" | sed -n 's/^VERSION: *\([0-9.]*\).*/\1/p' | head -1)"
          if [ -n "$PREV_TAG" ] && git rev-parse -q --verify "refs/tags/$PREV_TAG" >/dev/null; then RANGE="$PREV_TAG..HEAD"; else RANGE="HEAD~1..HEAD"; fi
          MSGS="$(git log --pretty=%B $RANGE)"
          FILES="$(git diff --name-only $RANGE)"
          NEWKT="$(git diff --diff-filter=A --name-only $RANGE | grep -E '\.kt$' || true)"
          if echo "$MSGS" | grep -qi '\[software\]'; then TYPE=software
          elif echo "$MSGS" | grep -qi '\[security\]'; then TYPE=security
          elif echo "$FILES" | grep -qE '^app/src/main/res/(layout|drawable|values|mipmap|anim|font|xml)/|Activity\.kt$|View\.kt$' || [ -n "$NEWKT" ]; then TYPE=software
          else TYPE=security; fi
          # Ensure new launcher icons are included in build workspace check
          git status
          BASE="$(tr -d ' \n' < version.txt)"
          if [ -z "$PREV_VER" ]; then NEW="$BASE"
          else
            IFS=. read -r MA MI PA <<< "$PREV_VER"; MI=${MI:-0}; PA=${PA:-0}
            if [ "$TYPE" = software ]; then NEW="$MA.$((MI+1))"; else NEW="$MA.$MI.$((PA+1))"; fi
            TOP="$(printf '%s\n%s\n' "$NEW" "$BASE" | sort -V | tail -1)"
            if [ "$TOP" = "$BASE" ] && [ "$BASE" != "$NEW" ]; then NEW="$BASE"; fi
          fi
          echo "UPD_TYPE=$TYPE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NEW" >> "$GITHUB_ENV"
          {
            echo "TYPE: $TYPE"
            echo "VERSION: $NEW"
            echo "---"
            # v3.6: सिर्फ़ असली बदलाव - PR का "## अपडेट में क्या नया" (Merge/टेस्ट/बैकअप/काम-विवरण नहीं)
            NOTES="$(python3 .github/scripts/release_notes.py "$RANGE" 2>/dev/null || true)"
            if [ -n "$NOTES" ]; then echo "$NOTES"; else echo "• छोटे सुधार और बेहतर स्थिरता"; fi
          } > release_notes.txt
          echo "Prakar: $TYPE  •  Version: $NEW  (pichhla: ${PREV_VER:-koi nahi}, $RANGE)"
          cat release_notes.txt

      - name: APK build (Release)
        env:
          DK_KS_PASS: ${{ secrets.DK_KS_PASS }}
          DK_KEY_ALIAS: dk
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk DK.apk

      - name: APK upload (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: DK-apk
          path: DK.apk

      # ऑडिट 13 नवंबर 2026: KVM चालू - पहले emulator बिना hardware acceleration के बहुत धीमा चलता था ("ProbeKVM: permissions")
      - name: KVM chalu
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: UAAG Android Emulator & Screenshots Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          script: |
            echo "UAAG Emulator successfully start ho gaya hai!"
            adb devices
            mkdir -p screenshots
            # App install check
            adb install -r DK.apk
            # App launch test (असली package: com.dk.assistant - पहले गलत com.dk.app था, इसलिए DK खुलता ही नहीं था)
            adb shell am start -W -n com.dk.assistant/.MainActivity || true
            sleep 8
            # Screenshot capture (DK कोडिंग एजेंट इन्हें ऐप में दिखाता है)
            timeout 30 adb exec-out screencap -p > screenshots/01_khulte_hi.png || true
            sleep 6
            timeout 30 adb exec-out screencap -p > screenshots/02_thodi_der_baad.png || true
            # ऐप चल रहा है या crash हुआ - नतीजा + crash log भी साथ
            if adb shell pidof com.dk.assistant > /dev/null; then echo "DK chal raha hai" > screenshots/status.txt; else echo "DK band ho gaya (crash?)" > screenshots/status.txt; fi
            timeout 30 adb logcat -d -b crash > screenshots/crash_log.txt || true
            cat screenshots/status.txt
            echo "Screenshot successfully capture ho gaya hai!"
            # ऑडिट 13 नवंबर 2026: पहले ऐप crash हो तब भी build हरा रहता था (और crash वाला APK release हो जाता). अब crash = build लाल
            if grep -q "band ho gaya" screenshots/status.txt; then echo "::error::DK emulator में खुलते ही बंद हो गया (crash) - screenshots/crash_log.txt देखें"; exit 1; fi

      - name: Screenshots upload (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uaag-screenshots
          path: screenshots/

      - name: GitHub Release (app ke andar update ke liye)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # नवंबर 2026: आख़िरी जाँच - यही version पहले से release में है, या नया version पिछले से छोटा = release नहीं
          # (एक नाम की दो release से app का update गड़बड़ाता था)
          LATEST_BODY="$(gh release view --json body -q .body 2>/dev/null || true)"
          LATEST_VER="$(printf '%s\n' "$LATEST_BODY" | sed -n 's/^VERSION: *\([0-9.]*\).*/\1/p' | head -1)"
          NAMES="$(gh release list --limit 200 --json name -q '.[].name' 2>/dev/null || true)"
          if printf '%s\n' "$NAMES" | grep -qxF "DK ${VERSION_NAME}"; then
            echo "::error::DK ${VERSION_NAME} नाम की release पहले से है - दोहराव रोका (दोबारा चलाइए, नया version लेगा)"; exit 1
          fi
          if [ -n "$LATEST_VER" ] && [ "$(printf '%s\n%s\n' "$LATEST_VER" "$VERSION_NAME" | sort -V | tail -1)" != "$VERSION_NAME" ]; then
            echo "::error::नया version ${VERSION_NAME} पिछली release ${LATEST_VER} से बड़ा नहीं - release रोकी"; exit 1
          fi
          # टैग उसी commit पर जिससे यह APK बना (बिना --target टैग main की नई नोक पर लग जाता था)
          gh release create "v${VERSION_CODE}" DK.apk \
            --target "$GITHUB_SHA" \
            --title "DK ${VERSION_NAME}" \
            --notes-file release_notes.txt \
            --latest