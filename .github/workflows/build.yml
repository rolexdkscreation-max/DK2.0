name: Build DK APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # Release banane ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signing key (hamesha ek hi)
        env:
          KS_B64: ${{ secrets.DK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dk.jks"
            echo "DK_KEYSTORE=$RUNNER_TEMP/dk.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::DK_KEYSTORE_B64 secret nahi mila - debug key se sign hoga"
          fi

      - name: APK build
        env:
          DK_KS_PASS: ${{ secrets.DK_KS_PASS }}
          DK_KEY_ALIAS: dk
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk DK.apk

      - name: APK upload (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: DK-apk
          path: DK.apk

      - name: GitHub Release (app ke andar update ke liye)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(git log -1 --pretty=%B)"
          gh release create "v${VERSION_CODE}" DK.apk \
            --title "DK 2.7.${VERSION_CODE}" \
            --notes "$NOTES" \
            --latest
