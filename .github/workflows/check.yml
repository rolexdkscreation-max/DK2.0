name: PR build check

# Sirf jaanch: PR ka code compile hota hai ya nahi (koi Release nahi banta)
on:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      # Kokoro TTS की बड़ी फ़ाइलें (app/build.gradle.kts लाता है) - हर बार दोबारा डाउनलोड नहीं
      - name: Kokoro TTS files cache
        uses: actions/cache@v4
        with:
          path: .dk-cache
          key: dk-kokoro-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: dk-kokoro-
      - name: Unit tests (aawaaz pehchaan / barge-in / deri ke hisse)
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Debug APK build
        run: gradle :app:assembleDebug --no-daemon
