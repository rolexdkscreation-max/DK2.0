name: PR build check

# Sirf jaanch: PR ka code compile hota hai ya nahi (koi Release nahi banta)
on:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests (aawaaz pehchaan / barge-in / deri ke hisse)
        run: gradle :app:testDebugUnitTest --no-daemon
      # नवंबर 2026 (Live जाँच #6): बात शुरू/खत्म का golden बेंचमार्क - scorecard PR के job summary में
      - name: Turn golden scorecard
        if: always()
        run: |
          if [ -f app/build/turn-golden.txt ]; then cat app/build/turn-golden.txt >> "$GITHUB_STEP_SUMMARY"; else echo "turn-golden.txt नहीं बना" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Debug APK build
        run: gradle :app:assembleDebug --no-daemon
