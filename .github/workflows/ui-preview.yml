name: UI Preview (Android emulator screenshots)

# Sirf ui/** branch par - main ka release/APK workflow isse nahi chalta
on:
  push:
    branches: [ 'ui/**' ]
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Naya APK (is branch ka)
        run: |
          gradle :app:assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/after.apk

      - name: Purana APK (main) - tulna ke liye
        run: |
          git worktree add /tmp/base origin/main
          cd /tmp/base && gradle :app:assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/before.apk

      - name: KVM chalu
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator par screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/ui/shots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: shots/
