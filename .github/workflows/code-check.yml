name: Code check (detekt + Android Lint)

# 16 नवंबर 2026 (मालिक: "कोड जाँच टूल जो भी लगाना है वो लगाओ").
# पुरानी गलतियाँ baseline में (config/detekt/baseline.xml, app/lint-baseline.xml) - सिर्फ़ नई गलती पर लाल.
# नया baseline (मालिक की मंज़ूरी से): detekt ... --create-baseline  /  gradle :app:updateLintBaseline
on:
  pull_request:
  workflow_dispatch:

jobs:
  detekt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: detekt
        run: |
          set -e
          curl -sSL -o detekt.zip https://github.com/detekt/detekt/releases/download/v1.23.7/detekt-cli-1.23.7.zip
          unzip -q detekt.zip
          detekt-cli-1.23.7/bin/detekt-cli --input app/src/main/java \
            --config config/detekt/detekt.yml --build-upon-default-config \
            --baseline config/detekt/baseline.xml --report txt:detekt.txt
      - name: detekt report
        if: always()
        run: if [ -s detekt.txt ]; then { echo '### detekt'; echo '```'; head -100 detekt.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android Lint
        run: gradle :app:lintDebug --no-daemon
      - name: Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
